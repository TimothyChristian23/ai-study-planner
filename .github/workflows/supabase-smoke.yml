name: Supabase Smoke Tests

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Deploy to GitHub Pages
    types:
      - completed

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SMOKE_EMAIL: ${{ secrets.SUPABASE_SMOKE_EMAIL }}
      SUPABASE_SMOKE_PASSWORD: ${{ secrets.SUPABASE_SMOKE_PASSWORD }}
      SUPABASE_SMOKE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SMOKE_ACCESS_TOKEN }}
      SUPABASE_SMOKE_RUN_AI: ${{ vars.SUPABASE_SMOKE_RUN_AI || 'false' }}
      AI_STUDY_APP_URL: ${{ vars.AI_STUDY_APP_URL || 'https://timothychristian23.github.io/ai-study-planner' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EMBEDDING_MODEL: ${{ secrets.OPENAI_EMBEDDING_MODEL || 'text-embedding-3-small' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Skip when Supabase secrets are missing
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_ANON_KEY == '' }}
        run: |
          echo "Skipping Supabase smoke tests."
          echo "Set SUPABASE_URL and SUPABASE_ANON_KEY repository secrets to enable them."

      - name: Run Supabase smoke tests
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        run: node scripts/supabase-smoke.mjs
